<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vesper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Vesper</title>
<style>
  :root{
    --bg:#0d0a12; --panel:#17111f; --line:#2c2238; --ink:#e9e1f2; --dim:#9d8fb0;
    --lit:#dccbf3; --fill:#2b1e3b; --rose:#c25b7a; --gold:#d9b26a; --moss:#7fa37a;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:17px;overscroll-behavior:none}
  .wrap{max-width:460px;margin:0 auto;padding:calc(10px + var(--safe-t)) 14px calc(20px + var(--safe-b))}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:10px}
  h1{font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:1px;font-variant:small-caps;cursor:pointer}
  h1 small{font-size:13px;color:var(--dim);display:block;letter-spacing:1.5px;margin-top:5px;font-variant:normal;text-transform:uppercase}
  .clock{text-align:right;color:var(--dim);font-size:14px;line-height:1.3}
  .clock b{color:var(--gold)}

  .stage{position:relative;height:300px;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    background:radial-gradient(ellipse at 50% 120%,#2a1b3a 0%,#120c1a 60%,#08060c 100%);transition:background 1.5s;touch-action:none}
  .stage.day{background:linear-gradient(#3b2b3f,#5a3d4a 55%,#2a1d2a)}
  .moon{position:absolute;top:20px;right:26px;width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff7e0,#e9d9a8 60%,#bfa978);box-shadow:0 0 36px 6px rgba(233,217,168,.22);transition:opacity 1.5s}
  .moon::after{content:"";position:absolute;top:6px;left:15px;width:30px;height:30px;border-radius:50%;background:#120c1a;opacity:.93}
  .day .moon{opacity:0}
  .stars{position:absolute;inset:0;transition:opacity 1.5s}
  .day .stars{opacity:.08}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite ease-in-out}
  @keyframes tw{50%{opacity:.2}}
  .curtain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s;
    background:repeating-linear-gradient(90deg,rgba(60,10,25,.55) 0 18px,rgba(40,5,15,.7) 18px 36px)}
  .day .curtain{opacity:.5}
  .ground{position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(transparent,#06040a)}
  .grave{position:absolute;bottom:12px;width:30px;height:40px;background:#221a2c;border-radius:14px 14px 3px 3px;border:1px solid #33283f}
  .grave::after{content:"✝";position:absolute;inset:0;display:grid;place-items:center;color:#4a3d58;font-size:16px}
  .branch{position:absolute;top:30px;left:50%;width:240px;height:9px;margin-left:-120px;border-radius:6px;
    background:linear-gradient(#3a2a22,#22170f);opacity:0;transition:opacity .6s}
  .sleeping .branch{opacity:1}

  #batWrap{position:absolute;left:50%;top:50%;width:240px;height:180px;margin:-100px 0 0 -120px;transition:transform .8s cubic-bezier(.5,1.6,.4,1), opacity .8s}
  #bat{width:100%;height:100%;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 0;cursor:pointer}
  #bat svg,#hunter svg{width:100%;height:100%;overflow:visible;transition:transform .8s cubic-bezier(.5,1.4,.4,1)}
  .wing{transform-box:fill-box;animation:flapL .5s ease-in-out infinite alternate}
  .wingL{transform-origin:100% 30%}
  .wingR{transform-origin:0% 30%;animation-name:flapR}
  @keyframes flapL{from{transform:rotate(8deg) scaleY(.92)}to{transform:rotate(-14deg) scaleY(1.04)}}
  @keyframes flapR{from{transform:rotate(-8deg) scaleY(.92)}to{transform:rotate(14deg) scaleY(1.04)}}
  .slow #bat .wing{animation-duration:1.3s}
  .sleeping #bat svg{transform:rotate(180deg) scale(.9)}
  .sleeping #bat .wing{animation:none;transform:scaleX(.45)}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .sleeping #batWrap{transform:translateY(-64px)}
  .sleeping #bat{animation:sway 4s ease-in-out infinite}
  @keyframes sway{50%{transform:rotate(3deg)}}
  .away #batWrap{opacity:0;transform:translate(160px,-220px) scale(.3)}
  .loop #batWrap{animation:loop 1.2s ease-in-out}
  @keyframes loop{0%{transform:none}25%{transform:translate(70px,-50px) rotate(90deg)}50%{transform:translate(0,-100px) rotate(180deg)}75%{transform:translate(-70px,-50px) rotate(270deg)}100%{transform:rotate(360deg)}}
  .dizzy #batWrap{animation:dizzy .25s linear 6}
  @keyframes dizzy{25%{transform:translateX(-8px) rotate(-6deg)}75%{transform:translateX(8px) rotate(6deg)}}
  .zzz{position:absolute;left:62%;top:44%;font-weight:700;color:var(--dim);font-size:22px;opacity:0}
  .sleeping .zzz{animation:z 3s infinite}
  @keyframes z{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(26px,-50px)}}
  .bubble{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:16px;font-weight:600;
    background:rgba(23,17,31,.9);border:1px solid var(--line);border-radius:12px;padding:8px 10px;transition:opacity .4s;pointer-events:none}
  .bubble:empty{opacity:0}
  .fx{position:absolute;inset:0;pointer-events:none}
  .float{position:absolute;font-size:22px;animation:up 1.4s ease-out forwards}
  @keyframes up{to{transform:translateY(-70px);opacity:0}}

  .bars{display:grid;gap:8px;margin:14px 2px 4px}
  .bar{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:10px;font-size:15px}
  .bar span{color:var(--dim);font-weight:700}
  .track{height:10px;border-radius:6px;background:#1f1729;border:1px solid var(--line);overflow:hidden}
  .fill{height:100%;border-radius:6px;transition:width .6s,background .6s}
  .bar em{font-style:normal;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:14px}

  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  button{font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:10px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  button i{font-style:normal;font-size:22px;line-height:1.1}
  button:active{transform:scale(.96);background:#20172b}
  button:disabled{opacity:.35}
  .foot{margin-top:14px;color:var(--dim);font-size:15px;line-height:1.4;min-height:42px}
  .banner{margin-top:10px;font-size:14px;color:var(--dim);border:1px dashed var(--line);border-radius:12px;padding:8px 10px;display:none}
  .banner.on{display:block}

  /* sheets */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet.on{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b));width:100%;max-width:460px;max-height:88vh;overflow:auto;-webkit-user-select:text;user-select:text}
  .card h3{font-size:22px;margin:0 0 4px;font-variant:small-caps;letter-spacing:1px}
  .card p{color:var(--dim);margin:6px 0 12px;font-size:15px;line-height:1.4}
  .card input{width:100%;font:inherit;font-size:19px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0f0b15;color:var(--ink);-webkit-user-select:text;user-select:text}
  .row{display:flex;gap:8px;margin-top:12px}
  .row button{flex:1;flex-direction:row;justify-content:center;padding:11px 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chips button{flex-direction:row;font-size:14px;padding:6px 11px;border-radius:20px}
  .sensor{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .sensor b{display:block;font-size:16px}
  .sensor small{color:var(--dim);font-size:13px;line-height:1.3;display:block}
  .sensor button{flex-direction:row;padding:7px 11px;font-size:13px;border-radius:10px}
  .ok{color:var(--moss)} .no{color:var(--dim)}
  .score{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:8px 0}
  .score img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .big{font-size:44px;font-weight:700;line-height:1;color:var(--gold)}
  .crit{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:14px;margin:5px 0;color:var(--dim)}
  .crit .track{height:8px}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .gallery figure{margin:0;position:relative}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
  .gallery figcaption{position:absolute;right:5px;bottom:5px;background:rgba(13,10,18,.85);border-radius:8px;padding:1px 6px;font-size:13px;color:var(--gold);font-weight:700}
  .log{font-size:14px;color:var(--dim);max-height:160px;overflow:auto;margin-top:6px}
  .log div{padding:3px 0;border-bottom:1px dashed #241b2e}

  /* game */
  .game{position:absolute;inset:0;display:none;background:rgba(8,6,12,.3)}
  .game.on{display:block}
  .gameinfo{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:20px;font-weight:700;color:var(--gold);pointer-events:none}
  .moth{position:absolute;width:38px;height:32px}
  .moth svg{width:100%;height:100%}
  .moth .mw{transform-origin:20px 17px;animation:mf .18s infinite alternate}
  @keyframes mf{to{transform:scaleX(.55)}}
  #hunter{position:absolute;width:90px;height:72px;pointer-events:none}
  #hunter .wing{animation-duration:.25s}
  .listening{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:none;gap:3px;align-items:flex-end;height:26px}
  .listening.on{display:flex}
  .listening span{width:5px;background:var(--lit);border-radius:2px;transition:height .08s}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="name">Vesper<small id="stageLbl">fladdermusunge</small></h1>
    <div class="clock"><b id="phase">Natt</b><br><span id="sun">–</span></div>
  </header>

  <div class="stage" id="stage">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="curtain"></div>
    <div class="branch"></div>
    <div class="ground"></div>
    <div class="grave" style="left:20px"></div>
    <div class="grave" style="right:30px;height:32px;width:26px"></div>
    <div id="batWrap"><div id="bat"><svg id="batSvg" viewBox="0 0 200 160" aria-label="Vesper">
        <defs>
          <radialGradient id="bodyG" cx="45%" cy="35%" r="70%">
            <stop offset="0" stop-color="#6a4d88"/><stop offset="1" stop-color="#3a2950"/>
          </radialGradient>
        </defs>
        <g class="wing wingL">
          <path d="M72 78 C55 52 28 48 6 60 C14 66 16 74 14 84 C24 78 32 82 36 92 C44 84 54 86 60 96 C64 90 68 86 74 88 Z" fill="#2e2040" stroke="#1d1429" stroke-width="2"/>
          <path d="M70 80 L14 84 M70 82 L36 92 M72 85 L60 96" stroke="#4a3560" stroke-width="1.5" fill="none"/>
        </g>
        <g class="wing wingR">
          <path d="M128 78 C145 52 172 48 194 60 C186 66 184 74 186 84 C176 78 168 82 164 92 C156 84 146 86 140 96 C136 90 132 86 126 88 Z" fill="#2e2040" stroke="#1d1429" stroke-width="2"/>
          <path d="M130 80 L186 84 M130 82 L164 92 M128 85 L140 96" stroke="#4a3560" stroke-width="1.5" fill="none"/>
        </g>
        <path d="M74 58 L68 22 L92 48 Z" fill="#3a2950" stroke="#1d1429" stroke-width="2" stroke-linejoin="round"/>
        <path d="M126 58 L132 22 L108 48 Z" fill="#3a2950" stroke="#1d1429" stroke-width="2" stroke-linejoin="round"/>
        <path d="M76 52 L72 32 L86 48 Z" fill="#c25b7a" opacity=".55"/>
        <path d="M124 52 L128 32 L114 48 Z" fill="#c25b7a" opacity=".55"/>
        <ellipse cx="100" cy="88" rx="38" ry="40" fill="url(#bodyG)" stroke="#1d1429" stroke-width="2"/>
        <ellipse cx="100" cy="104" rx="20" ry="18" fill="#8a73a3" opacity=".45"/>
        <path d="M90 127 l-3 7 M110 127 l3 7" stroke="#1d1429" stroke-width="3" stroke-linecap="round"/>
        <g id="eyesOpen">
          <circle cx="86" cy="82" r="11" fill="#fff"/><circle cx="114" cy="82" r="11" fill="#fff"/>
          <circle id="pL" cx="87" cy="84" r="7" fill="#1a1022"/><circle id="pR" cx="113" cy="84" r="7" fill="#1a1022"/>
          <circle id="gL" cx="90" cy="80" r="2.6" fill="#fff"/><circle id="gR" cx="116" cy="80" r="2.6" fill="#fff"/>
        </g>
        <g id="eyesSad" style="display:none">
          <path d="M76 75 L95 80" stroke="#1d1429" stroke-width="3" stroke-linecap="round"/>
          <path d="M124 75 L105 80" stroke="#1d1429" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g id="eyesClosed" style="display:none">
          <path d="M78 84 Q86 90 94 84" stroke="#1a1022" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M106 84 Q114 90 122 84" stroke="#1a1022" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <g id="eyesHappy" style="display:none">
          <path d="M78 86 Q86 76 94 86" stroke="#1a1022" stroke-width="3.2" fill="none" stroke-linecap="round"/>
          <path d="M106 86 Q114 76 122 86" stroke="#1a1022" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        </g>
        <ellipse id="cheekL" cx="74" cy="96" rx="6" ry="3.5" fill="#c25b7a" opacity=".6"/>
        <ellipse id="cheekR" cx="126" cy="96" rx="6" ry="3.5" fill="#c25b7a" opacity=".6"/>
        <path id="mouth" d="M92 98 Q100 106 108 98" stroke="#1a1022" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path id="fangs" d="M95 100 L97 106 L99 101 Z M105 100 L103 106 L101 101 Z" fill="#fff"/>
      </svg></div></div>
    <div class="zzz">z</div>
    <div class="fx" id="fx"></div>
    <div class="listening" id="listening"></div>
    <div class="bubble" id="bubble"></div>
    <div class="game" id="game">
      <div id="hunter"></div>
      <div class="gameinfo"><span id="gScore">0</span><span id="gTime">15</span></div>
    </div>
  </div>

  <div class="bars">
    <div class="bar"><span>Mat</span><div class="track"><div class="fill" id="fHunger"></div></div><em id="vHunger"></em></div>
    <div class="bar"><span>Energi</span><div class="track"><div class="fill" id="fEnergy"></div></div><em id="vEnergy"></em></div>
    <div class="bar"><span>Humör</span><div class="track"><div class="fill" id="fMood"></div></div><em id="vMood"></em></div>
  </div>

  <div class="actions">
    <button id="bFeed"><i>🍇</i>Mata</button>
    <button id="bPlay"><i>🦋</i>Jaga</button>
    <button id="bPhoto"><i>📷</i>Visa bild</button>
    <button id="bSleep"><i>🌙</i>Sov</button>
    <button id="bWhistle"><i>🎵</i>Vissla</button>
    <button id="bGallery"><i>🖼️</i>Galleri</button>
    <button id="bSensors"><i>✨</i>Sinnen</button>
    <button id="bDiary"><i>📜</i>Dagbok</button>
  </div>
  <input type="file" id="photoIn" accept="image/*" hidden>

  <div class="foot" id="tip"></div>
  <div class="banner" id="install"></div>
</div>

<!-- name sheet -->
<div class="sheet" id="sName"><div class="card">
  <h3>Vad ska hon heta?</h3>
  <input id="nameIn" maxlength="16" autocomplete="off">
  <div class="chips" id="sugg"></div>
  <div class="row"><button data-close>Avbryt</button><button id="nOk">Spara</button></div>
</div></div>

<!-- photo result -->
<div class="sheet" id="sPhoto"><div class="card">
  <h3 id="pTitle">Vesper tittar…</h3>
  <div class="score"><img id="pImg" alt=""><div><div class="big" id="pScore">–</div><p id="pSay" style="margin:6px 0 0"></p></div></div>
  <div id="pCrit"></div>
  <div class="row"><button data-close>Stäng</button><button id="pAgain">📷 En till</button></div>
</div></div>

<!-- gallery -->
<div class="sheet" id="sGallery"><div class="card">
  <h3>Vespers vägg</h3>
  <p>De bästa bilderna du har visat henne.</p>
  <div class="gallery" id="gal"></div>
  <div class="row"><button data-close>Stäng</button></div>
</div></div>

<!-- sensors -->
<div class="sheet" id="sSensors"><div class="card">
  <h3>Vespers sinnen</h3>
  <p>Det här kan hon känna av i den här telefonen. Det som inte stöds hoppas över.</p>
  <div id="sensorList"></div>
  <div class="row"><button data-close>Klar</button></div>
</div></div>

<!-- diary -->
<div class="sheet" id="sDiary"><div class="card">
  <h3>Dagbok</h3>
  <div class="log" id="log"></div>
  <div class="row"><button id="dReset">🪦 Börja om</button><button data-close>Stäng</button></div>
</div></div>

<script>
(() => {
  "use strict";
  const KEY = "vesper-app-v1", GKEY = "vesper-gallery-v1";
  const $ = id => document.getElementById(id);
  const clamp = v => Math.max(0, Math.min(100, v));
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const NYKOPING = {lat: 58.753, lng: 17.009};

  // ---------- state ----------
  function fresh(){
    const now = Date.now();
    return {name:"Vesper", born:now, last:now, hunger:70, energy:80, mood:70, asleep:false,
      away:false, awayUntil:0, neglect:0, petAt:0, loc:null, nfcBed:null, photos:[], log:[]};
  }
  function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.born) return Object.assign(fresh(), s); }catch(e){} return null; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  let S = load() || fresh();
  let gallery = []; try{ gallery = JSON.parse(localStorage.getItem(GKEY)) || []; }catch(e){}
  const saveGallery = () => { try{ localStorage.setItem(GKEY, JSON.stringify(gallery)); }catch(e){ gallery.pop(); } };

  function log(msg){
    const t = new Date().toLocaleString("sv-SE",{weekday:"short",hour:"2-digit",minute:"2-digit"});
    S.log.unshift(t+" – "+msg); S.log = S.log.slice(0,60);
  }
  let bubbleT;
  function say(msg, ms=3800){ $("bubble").textContent = msg; clearTimeout(bubbleT); bubbleT = setTimeout(()=>$("bubble").textContent="", ms); }
  function floaty(ch="🖤", n=4){
    for(let i=0;i<n;i++){
      const h = document.createElement("div"); h.className="float"; h.textContent=ch;
      h.style.left=(38+Math.random()*24)+"%"; h.style.top=(32+Math.random()*16)+"%"; h.style.animationDelay=(i*.12)+"s";
      $("fx").appendChild(h); setTimeout(()=>h.remove(),1900);
    }
  }
  function flash(cls, ms){ const st=$("stage"); st.classList.remove(cls); void st.offsetWidth; st.classList.add(cls); setTimeout(()=>st.classList.remove(cls), ms); }

  // ---------- haptics (Android: vibrate, iOS: switch-input trick) ----------
  let hapticLabel = null;
  function haptic(pattern=[18]){
    if(!isIOS && navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} return; }
    if(!isIOS) return;
    if(!hapticLabel){
      hapticLabel = document.createElement("label"); hapticLabel.style.display="none";
      const i = document.createElement("input"); i.type="checkbox"; i.setAttribute("switch","");
      hapticLabel.appendChild(i); document.body.appendChild(hapticLabel);
    }
    const taps = Math.max(1, Math.ceil(pattern.length/2));
    for(let k=0;k<taps;k++) setTimeout(()=>hapticLabel.click(), k*70);
  }
  const purr = () => haptic([12,40,12,40,12,40,12,40,12]);

  // ---------- face ----------
  const MOUTHS = {
    smile:"M92 98 Q100 106 108 98", open:"M91 97 Q100 112 109 97 Z", sad:"M92 104 Q100 97 108 104",
    flat:"M94 101 L106 101", sleep:"M96 100 Q100 102 104 100"
  };
  function setFace(name){
    const eyes = {idle:"Open", blink:"Closed", happy:"Happy", sad:"Sad", sleep:"Closed"}[name] || "Open";
    for(const k of ["Open","Closed","Happy","Sad"]) $("eyes"+k).style.display = "none";
    $("eyes"+eyes).style.display = "";
    if(eyes === "Sad") $("eyesOpen").style.display = "";          // sad = open eyes + worried brows
    const m = {idle:"smile", blink:"smile", happy:"open", sad:"sad", sleep:"sleep"}[name] || "smile";
    $("mouth").setAttribute("d", MOUTHS[m]);
    $("mouth").setAttribute("fill", m === "open" ? "#1a1022" : "none");
    $("fangs").style.display = (m === "smile" || m === "open") ? "" : "none";
    const blush = name === "happy" ? ".9" : name === "sad" ? ".25" : ".6";

  function onOrient(ev){ if(ev.gamma != null) tilt = Math.max(-35, Math.min(35, ev.gamma)) / 35; }
  let lastShake = 0;
  function onShake(){
    if(Date.now()-lastShake < 3000 || S.away || gameOn) return; lastShake = Date.now();
    if(S.asleep) toggleSleep("skakning");
    else { S.mood = clamp(S.mood-3); say("Ooojoj… allt snurrar!"); flash("dizzy",1500); haptic([40,60,40]); save(); render(); }
  }
  async function enableMotion(){
    try{
      if(typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
        const p = await DeviceMotionEvent.requestPermission(); if(p !== "granted") return false;
        if(typeof DeviceOrientationEvent.requestPermission === "function") await DeviceOrientationEvent.requestPermission();
      }
      if(!motionOn){ window.addEventListener("devicemotion", onMotion); window.addEventListener("deviceorientation", onOrient); motionOn = true; }
      try{ localStorage.setItem("vesper-motion","1"); }catch(e){}
      return true;
    }catch(e){ return false; }
  }

  // ---------- location ----------
  function enableLocation(){
    return new Promise(res => {
      if(!navigator.geolocation) return res(false);
      navigator.geolocation.getCurrentPosition(p => {
        S.loc = {lat:+p.coords.latitude.toFixed(3), lng:+p.coords.longitude.toFixed(3)}; save(); render(); res(true);
      }, () => res(false), {maximumAge: 6*3.6e6, timeout: 15000});
    });
  }

  // ---------- NFC (Chrome Android) ----------
  let nfcReader = null, nfcPairing = false;
  async function startNfc(){
    if(!("NDEFReader" in window)) return false;
    try{
      if(!nfcReader){
        nfcReader = new NDEFReader(); await nfcReader.scan();
        nfcReader.onreading = ev => {
          if(nfcPairing){ S.nfcBed = ev.serialNumber; nfcPairing = false; save(); say("Taggen är nu Vespers säng. Blippa den för att natta eller väcka henne."); haptic([30,50,30]); renderSensors(); log("En NFC-tagg blev Vespers säng."); }
          else if(S.nfcBed && ev.serialNumber === S.nfcBed) toggleSleep("NFC-sängen");
          else if(!S.nfcBed) say("Okänd tagg. Para ihop den under Sinnen.");
        };
      }
      return true;
    }catch(e){ return false; }
  }

  // ---------- battery (Chrome) ----------
  let battery = null;
  if(navigator.getBattery) navigator.getBattery().then(b => { battery = b; b.onlevelchange = b.onchargingchange = render; render(); }).catch(()=>{});

  // ---------- sensors sheet ----------
  function renderSensors(){
    const rows = [];
    const add = (ic, t, sub, state, btn) => rows.push('<div class="sensor"><span style="font-size:22px">'+ic+'</span><div><b>'+t+' <span class="'+(state?"ok":"no")+'">'+(state?"✓":"")+'</span></b><small>'+sub+'</small></div>'+(btn||"<span></span>")+'</div>');
    add("📷","Kamera","Visa bilder – hon bedömer skärpa, ljus, färg och komposition. Stjärnor och månen ger bonus.", true);
    add("🎵","Mikrofon","Vissla en melodi eller klappa. Väcker henne om hon sover.", !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
    const motionSupported = "DeviceMotionEvent" in window;
    add("📳","Rörelse","Skaka för att väcka henne. Luta telefonen för att styra henne i jakten.", motionOn,
      motionSupported ? (motionOn ? "" : '<button id="enMotion">Aktivera</button>') : '<small class="no">stöds ej</small>');
    add("🌍","Plats","Riktig soluppgång och solnedgång där du är."+(S.loc ? "" : " Just nu: Nyköping."), !!S.loc,
      navigator.geolocation ? '<button id="enLoc">'+(S.loc?"Uppdatera":"Aktivera")+'</button>' : "");
    const hasNfc = "NDEFReader" in window;
    add("🛏️","NFC-säng","Para ihop en NFC-tagg, sätt den vid sängen och blippa för att natta henne.", hasNfc && !!S.nfcBed,
      hasNfc ? '<button id="enNfc">'+(S.nfcBed?"Byt tagg":"Para ihop")+'</button>' : '<small class="no">bara Android</small>');
    add("💜","Haptik", isIOS ? "Lätta tick när du klappar henne (iPhone-variant)." : "Hon spinner i handen när du klappar henne.", isIOS || !!navigator.vibrate);
    add("🔋","Batteri","Hon gäspar när telefonen är nästan urladdad.", !!battery, battery ? "" : '<small class="no">stöds ej</small>');
    $("sensorList").innerHTML = rows.join("");
    const m = $("enMotion"); if(m) m.onclick = async () => { const ok = await enableMotion(); say(ok ? "Nu känner hon när du rör telefonen." : "Rörelse nekades."); renderSensors(); };
    const l = $("enLoc"); if(l) l.onclick = async () => { l.textContent="…"; const ok = await enableLocation(); say(ok ? "Nu följer hon solen där du är." : "Platsen nekades – hon använder Nyköping."); renderSensors(); };
    const n = $("enNfc"); if(n) n.onclick = async () => { const ok = await startNfc(); if(ok){ nfcPairing = true; say("Håll en NFC-tagg mot telefonens baksida…", 8000); closeSheets(); } else say("NFC kunde inte startas. Är NFC påslaget i inställningarna?"); };
  }
  $("bSensors").onclick = () => { renderSensors(); openSheet("sSensors"); };

  // ---------- moth hunt ----------
  const MOTH = '<svg viewBox="0 0 40 34"><g class="mw"><path d="M20 17 C10 2 0 6 3 16 C0 26 10 30 20 17 Z" fill="#d8c9a8"/><path d="M20 17 C30 2 40 6 37 16 C40 26 30 30 20 17 Z" fill="#d8c9a8"/><circle cx="10" cy="14" r="2.4" fill="#8a6f4a"/><circle cx="30" cy="14" r="2.4" fill="#8a6f4a"/></g><ellipse cx="20" cy="18" rx="2.4" ry="7" fill="#6b5435"/></svg>';
  let gameOn = false;
  $("bPlay").onclick = () => {
    if(gameOn) return;
    gameOn = true; let caught = 0, t = 15;
    const g = $("game"), st = $("stage"), hunter = $("hunter");
    g.classList.add("on"); $("batWrap").style.opacity = 0;
    $("gScore").textContent = "0 🦋"; $("gTime").textContent = t;
    say(motionOn ? "Luta telefonen för att flyga – eller tryck på fjärilarna!" : "Dra med fingret för att flyga – eller tryck på fjärilarna!", 2600);
    const W = st.clientWidth, H = st.clientHeight;
    let hx = W/2, hy = H*.55, frame = 0, targetX = null;
    const moths = new Set();
    const onMove = ev => { const r = st.getBoundingClientRect(); targetX = ev.clientX - r.left; };
    st.addEventListener("pointermove", onMove); st.addEventListener("pointerdown", onMove);
    const catchMoth = o => { caught++; $("gScore").textContent = caught+" 🦋"; haptic([12]); const p=document.createElement("div"); p.className="float"; p.textContent="✨"; p.style.left=o.x+"px"; p.style.top=o.y+"px"; g.appendChild(p); setTimeout(()=>p.remove(),1400); o.m.remove(); moths.delete(o); };
    const spawn = setInterval(() => {
      const m = document.createElement("div"); m.className="moth"; m.innerHTML = MOTH;
      const fromLeft = Math.random() < .5;
      const o = {m, x: fromLeft?-40:W, y: 40+Math.random()*(H-110), vx:(fromLeft?1:-1)*(1.4+Math.random()*1.6), ph:Math.random()*6};
      m.addEventListener("pointerdown", ev => { ev.stopPropagation(); catchMoth(o); });
      moths.add(o); g.appendChild(m);
    }, 600);
    let raf;
    const loop = () => {
      frame++;
      if(motionOn) hx += tilt*7;
      else if(targetX != null) hx += (targetX - hx)*.12;
      hx = Math.max(30, Math.min(W-30, hx)); hy = H*.55 + Math.sin(frame/12)*10;
      hunter.style.left = (hx-45)+"px"; hunter.style.top = (hy-36)+"px";
      moths.forEach(o => {
        o.x += o.vx; o.ph += .08; const yy = o.y + Math.sin(o.ph)*18;
        o.m.style.left = o.x+"px"; o.m.style.top = yy+"px";
        if(Math.hypot(o.x+19-hx, yy+16-hy) < 34) catchMoth(o);
        else if(o.x < -60 || o.x > W+20){ o.m.remove(); moths.delete(o); }
      });
      raf = requestAnimationFrame(loop);
    };
    loop();
    const timer = setInterval(() => {
      t--; $("gTime").textContent = t;
      if(t > 0) return;
      clearInterval(timer); clearInterval(spawn); cancelAnimationFrame(raf);
      st.removeEventListener("pointermove", onMove); st.removeEventListener("pointerdown", onMove);
      moths.forEach(o=>o.m.remove()); moths.clear(); g.classList.remove("on"); $("batWrap").style.opacity = ""; gameOn = false;
      S.hunger = clamp(S.hunger + caught*4); S.mood = clamp(S.mood + 8 + caught*2); S.energy = clamp(S.energy - 10);
      say(caught >= 10 ? caught+" fjärilar! En sann nattens jägare." : caught ? "Fångade "+caught+". Mums!" : "Inga alls… nästa gång!", 4000);
      if(caught) { react("happy",2000); floaty("🦋", Math.min(caught,5)); }
      log(S.name+" jagade och fångade "+caught+" nattfjärilar.");
      save(); render();
    }, 1000);
  };

  // mini-Vesper for the hunt: a copy of the SVG without ids (except the gradient)
  $("hunter").innerHTML = $("batSvg").outerHTML.replace(/ id="(?!bodyG)[^"]*"/g, "").replace(/style="display:none"/g, 'style="display:none" data-x');

  // ---------- sheets ----------
  function openSheet(id){ document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("on")); $(id).classList.add("on"); }
  function closeSheets(){ document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("on")); }
  document.querySelectorAll(".sheet").forEach(s => s.addEventListener("click", e => { if(e.target === s || e.target.hasAttribute("data-close")) closeSheets(); }));

  const NAMES = ["Vesper","Morticia","Skugga","Nyx","Lilith","Bläck","Korpi","Natt"];
  $("sugg").innerHTML = NAMES.map(n => '<button data-n="'+n+'">'+n+'</button>').join("");
  $("sugg").onclick = e => { const n = e.target.dataset.n; if(n) $("nameIn").value = n; };
  $("name").onclick = () => { $("nameIn").value = S.name; openSheet("sName"); };
  $("nOk").onclick = () => { const v = $("nameIn").value.trim(); if(v && v !== S.name){ log("Fick namnet "+v+"."); S.name = v; } closeSheets(); save(); render(); };

  $("bDiary").onclick = () => {
    $("log").innerHTML = S.log.map(l => "<div>"+l.replace(/</g,"&lt;")+"</div>").join("") || "<div>Inget har hänt än.</div>";
    openSheet("sDiary");
  };
  let resetArm = 0;
  $("dReset").onclick = () => {
    if(Date.now()-resetArm > 3000){ resetArm = Date.now(); $("dReset").textContent = "Tryck igen för att börja om"; setTimeout(()=>$("dReset").textContent="🪦 Börja om",3000); return; }
    const keep = {loc:S.loc, nfcBed:S.nfcBed}; S = Object.assign(fresh(), keep); log("En ny liten fladdermus kläcktes."); save(); closeSheets(); render(); say("Hej! Jag är ny här.");
  };

  // ---------- install hint ----------
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; showInstall(); });
  function showInstall(){
    if(standalone) return;
    const b = $("install");
    if(deferredPrompt){ b.innerHTML = 'Lägg Vesper på hemskärmen så bor hon i telefonen. <button id="instBtn" style="display:inline-flex;margin-top:6px;padding:6px 12px">Installera</button>';
      b.classList.add("on"); $("instBtn").onclick = async () => { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; b.classList.remove("on"); }; }
    else if(isIOS){ b.textContent = "Tips: tryck på Dela → ”Lägg till på hemskärmen” så bor Vesper i telefonen."; b.classList.add("on"); }
  }
  showInstall();
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});

  // ---------- boot ----------
  let st = ""; for(let i=0;i<40;i++) st += '<div class="star" style="left:'+(Math.random()*100)+'%;top:'+(Math.random()*60)+'%;animation-delay:'+(Math.random()*3)+'s;opacity:'+(.3+Math.random()*.7)+'"></div>';
  $("stars").innerHTML = st;
  // Android needs no permission for motion; turn it on silently if it worked before or isn't gated
  try{ if(typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission !== "function") enableMotion();
       else if(localStorage.getItem("vesper-motion")) document.addEventListener("click", function once(){ enableMotion(); document.removeEventListener("click", once); }); }catch(e){}
  if(S.nfcBed && navigator.permissions) navigator.permissions.query({name:"nfc"}).then(p => { if(p.state === "granted") startNfc(); }).catch(()=>{});
  if(S.loc && navigator.permissions) navigator.permissions.query({name:"geolocation"}).then(p => { if(p.state === "granted") enableLocation(); }).catch(()=>{});
  if(!S.log.length){ log("En liten fladdermus kläcktes i kyrktornet."); say("Hej! Tryck på mig för att klappa. Under ✨ Sinnen ser du vad jag kan känna.", 6000); }
  tick(); animate();
  setInterval(tick, 5000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) tick(); });
})();
</script>
</body>
</html>
